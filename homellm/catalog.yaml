# Curated GGUF models on Hugging Face that homellm nodes can download and run with llama-server.
#
# Add your own (or override one by name) in ~/.config/homellm/catalog.yaml on the main server and nodes:
#
#   models:
#     - name: my-model            # profile name = model id clients ask for
#       repo: owner/Some-GGUF     # Hugging Face repo
#       quant: Q4_K_M             # file suffix to pick (split files are fetched together)
#       mmproj: true              # also fetch the vision projector
#       context: 32768
#       parallel: 1
#       args: [--flash-attn, "on"]
#
# vram_gb is a rough figure for the weights plus the listed context; it decides nothing, it is shown in the
# dashboard so you can pick models that fit a node.

models:
  # ---- Gemma 4 ------------------------------------------------------------------------------------------------
  - name: gemma-4-26b-a4b
    repo: unsloth/gemma-4-26B-A4B-it-GGUF
    quant: UD-Q4_K_XL
    mmproj: true
    context: 50176
    parallel: 2
    vram_gb: 21
    tags: [chat, vision, moe]
    notes: Mixture of experts (4B active), fast on a single 24 GB card.
    args: [--flash-attn, "on", --cache-type-k, q8_0, --cache-type-v, q8_0, --ctx-checkpoints, "4"]
  - name: gemma-4-31b
    repo: unsloth/gemma-4-31B-it-GGUF
    quant: Q4_K_M
    context: 16384
    vram_gb: 22
    tags: [chat, dense]
    notes: Dense, slower than the 26B MoE, stronger on long reasoning.
  - name: gemma-4-e4b
    repo: unsloth/gemma-4-E4B-it-GGUF
    quant: Q4_K_M
    mmproj: true
    context: 32768
    parallel: 2
    vram_gb: 7
    tags: [chat, vision, small]
    notes: Small; fits 8 GB cards.

  # ---- Qwen ---------------------------------------------------------------------------------------------------
  - name: qwen3.6-35b-a3b
