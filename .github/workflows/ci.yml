name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }} && uv pip install -e '.[dev]'
      - run: .venv/bin/ruff check homellm tests
      - run: .venv/bin/pytest -q
      - run: for f in scripts/*.sh fan-control/*.sh; do bash -n "$f"; done
      - run: shellcheck fan-control/*.sh fan-control/hosts/*.conf scripts/*.sh
