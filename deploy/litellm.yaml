# LiteLLM gateway config. Local models are added and removed automatically by the homellm
# controller (ids prefixed "homellm-"). Add cloud models here or in the LiteLLM UI as usual.
model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

litellm_settings:
  drop_params: true
  request_timeout: 600
