# shellcheck shell=bash disable=SC2034
# ai2-pc (192.168.1.210): Gigabyte B550M GAMING X WIFI6, Ryzen (k10temp), Tesla P40 24GB (slows down at 92C,
# shuts off at 95C).
#
# Fan chip: ITE IT8689E. The in-kernel it87 doesn't know it; with force_id it reads but can't control the fans.
# Needs the out-of-tree frankcrawford/it87 driver (DKMS) plus `options it87 ignore_resource_conflict=1` in
# /etc/modprobe.d/it87.conf, because the firmware claims the chip.
#
# Header map from probe.sh on 2026-11-04 (one header at a time, by RPM and by P40 temperature):
#   pwm1: fan1, 2824 rpm at 100% / 810 at 30%; P40 unaffected; probably the CPU fan. Left to the BIOS.
#   pwm2: no tach; the P40 warmed 42->45C in 30 s with it off, other headers moved it <=1C. The P40 fan.
#   pwm3: fan3, 1923 rpm at 100% / 806 at 30%; P40 unaffected; a case fan. Left to the BIOS.
#   pwm4, pwm5: nothing connected (manual 0 from the BIOS); left untouched.

MODULE=it87
CHIP="it8689*"            # the driver names it it8689_<id>
CPU_CHIP=k10temp
CPU_TEMP=temp1_input
NGPU=1

GPU_HEADERS="2"
CPU_HEADERS=""
MIXED_HEADERS=""
BIOS_HEADERS="1 3"
FIXED=""
AUTO_ENABLE=2             # it87: 2 = automatic (what the BIOS had)

GPU_MIN=77                # 30%; the fan has no tach, so its stall point is unknown
CPU_MIN=64
GPU_RAMP_DOWN=1
CPU_RAMP_DOWN=5

GPU_CURVE=(50:77 60:128 70:175 76:225 80:255)   # full speed 12C below the P40's 92C slowdown
CPU_CURVE=(72:64 85:110 91:190 94:255)          # unused (no CPU headers), but required
CPU_PANIC=93
CPU_AVG_SAMPLES=5
