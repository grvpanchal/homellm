# shellcheck shell=bash disable=SC2034
# TODO ai2-pc (192.168.1.210): Gigabyte B550M GAMING X WIFI6, Tesla P40 24GB (slows down at 92C, shuts off at 95C).
#
# NOT READY. fanctl refuses to start while GPU_HEADERS is empty.
# - Fan chip: ITE IT8688E. The in-kernel it87 (kernel 7.0) doesn't know it ("No such device").
#   `modprobe it87 force_id=0x8628 ignore_resource_conflict=1` loads and reads sane values (3.3V, VBAT, temps,
#   fan1 ~1350 rpm, fan3 ~1340 rpm), but probe.sh on 2026-11-03 showed NO fan responding to any pwm1-5 write,
#   so force_id can read but not control. Needs the out-of-tree frankcrawford/it87 driver (DKMS; Secure Boot
#   is off on this machine). It likely also needs ignore_resource_conflict=1 in /etc/modprobe.d.
# - The P40 fan is on a SYS_FAN header. Once the driver controls the fans, find which one with probe.sh.
# - The P40 curve below is a starting point only: it reaches 255 at 80C, well below the 92C slowdown.

MODULE=it87               # TODO confirm
CHIP=""                   # TODO hwmon name, e.g. it8688
CPU_CHIP=k10temp
CPU_TEMP=temp1_input
NGPU=1

GPU_HEADERS=""            # TODO
CPU_HEADERS=""            # TODO
MIXED_HEADERS=""          # TODO
BIOS_HEADERS=""
FIXED=""
AUTO_ENABLE=2             # TODO it87 uses 2 for automatic; check the driver docs

GPU_MIN=77
CPU_MIN=64
GPU_RAMP_DOWN=1
CPU_RAMP_DOWN=5

GPU_CURVE=(50:77 60:128 70:175 76:225 80:255)
CPU_CURVE=(72:64 85:110 91:190 94:255)
CPU_PANIC=93
CPU_AVG_SAMPLES=5
