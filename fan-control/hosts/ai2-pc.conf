# shellcheck shell=bash disable=SC2034
# TODO ai2-pc (192.168.1.210): Gigabyte B550M GAMING X WIFI6, Tesla P40 24GB (slows down at 92C, shuts off at 95C).
#
# NOT READY. fanctl refuses to start while GPU_HEADERS is empty.
# - The fan chip has no Linux driver loaded yet: hwmon only shows acpitz, k10temp, gigabyte_wmi (temps only)
#   and amdgpu. Gigabyte B550 boards usually use an ITE IT868x chip, which needs the it87 driver (possibly
#   with force_id=..., or the out-of-tree frankcrawford/it87 build). Find the driver, then set MODULE and CHIP.
# - Then find the P40's fan header with identify.sh, one header at a time.
# - The P40 curve below is a starting point only: it reaches 255 at 80C, well below the 92C slowdown.

MODULE=it87               # TODO confirm
CHIP=""                   # TODO hwmon name, e.g. it8688
CPU_CHIP=k10temp
CPU_TEMP=temp1_input
NGPU=1

GPU_HEADERS=""            # TODO
CPU_HEADERS=""            # TODO
MIXED_HEADERS=""          # TODO
BIOS_HEADERS=""
FIXED=""
AUTO_ENABLE=2             # TODO it87 uses 2 for automatic; check the driver docs

GPU_MIN=77
CPU_MIN=64
GPU_RAMP_DOWN=1
CPU_RAMP_DOWN=5

GPU_CURVE=(50:77 60:128 70:175 76:225 80:255)
CPU_CURVE=(72:64 85:110 91:190 94:255)
CPU_PANIC=93
CPU_AVG_SAMPLES=5
