# shellcheck shell=bash disable=SC2034
# ui-pc (192.168.1.212): ASUS TUF GAMING B550-PLUS WIFI II (Nuvoton NCT6798D), Ryzen 7 5700G, 2x Tesla P100 16GB.
# Header map confirmed one header at a time on 2026-11-03 (fan-control/README.md).

MODULE=nct6775            # kernel driver, loaded at boot and before the service starts
CHIP=nct6798              # hwmon name of the fan chip
CPU_CHIP=k10temp
CPU_TEMP=temp1_input      # Tctl
NGPU=2                    # fewer (or more) GPU temperatures than this means fail-safe

GPU_HEADERS="3 6"         # pwm3: 1st P100 fans (no tach, stall at 30%); pwm6: 2nd P100 fans (no tach)
CPU_HEADERS="2"           # CPU cooler, rpm on fan2 and fan7
MIXED_HEADERS="4"         # case fan (fan4), follows the hotter of the GPU and CPU curves
BIOS_HEADERS="1"          # nothing audible, left to the BIOS
FIXED="5:153"             # nothing audible, held at manual 153
AUTO_ENABLE=5             # nct6775 SmartFan IV = BIOS control

GPU_MIN=77                # 30%: the P100 fans stop below this; 50% made them hunt
CPU_MIN=64                # 25%: pwm2/pwm4 fans bottom out around 620-660 rpm
GPU_RAMP_DOWN=1           # 1 pwm unit per 3 s step, so the GPU fans don't hunt
CPU_RAMP_DOWN=5

GPU_CURVE=(45:77 55:128 65:175 72:225 76:255)   # P100 slows down at 82C, shuts off at 85C
CPU_CURVE=(72:64 85:110 91:190 94:255)          # 5700G, max 95C
CPU_PANIC=93
CPU_AVG_SAMPLES=5         # 15 s moving average of Tctl, which jumps around on Ryzen
